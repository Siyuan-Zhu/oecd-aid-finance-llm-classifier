[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oecd-aid-finance-llm-classifier"
version = "0.2.0"
description = "Few-shot OECD 5-digit purpose coding with FLAN-UL2 on SageMaker: similarity-selected examples, Vote-K annotation, per-sector prompts"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]
sbert = ["sentence-transformers>=3,<6"]
aws = ["boto3>=1.28,<2"]
deploy = ["boto3>=1.28,<2", "sagemaker>=2.140,<3", "huggingface_hub>=0.13", "hf-transfer"]
build = ["openpyxl>=3.1,<4"]

[project.scripts]
purpose-classify = "purpose_coder.classify:main"
purpose-annotate = "purpose_coder.votek:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
